name: Build macOS

# Separate from ci.yml on purpose, and deliberately NOT on every push.
#
# macOS runner minutes bill at 10x (design/cicd_plan.md §8, where a nightly
# macOS job was measured at 3x the whole free tier), so this runs only when a
# change could plausibly break the macOS build: the platform folder itself, the
# Dart the build compiles, the dependency set the Podfile is generated from, the
# probe this workflow runs, or the workflow file. Everything else — design docs,
# tests, the other five platform folders — costs nothing.
#
# workflow_dispatch is here so the build can be re-run on demand after a change
# the paths filter does not cover, e.g. a new Flutter pin or a Homebrew update
# that moves a dylib.
on:
  pull_request:
    branches: [main]
    paths:
      - 'macos/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tool/tesseract_dylib_probe.dart'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

# Ten pushes to a branch must cost one run, not ten. At 10x billing this block
# is worth more here than it is in ci.yml.
concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build macOS · probe libtesseract
    runs-on: macos-latest
    # A cold run pays a pod install, a full release xcodebuild and a Homebrew
    # install. 45 caps a hang without cutting an honest cold build short.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the same version as ci.yml. Two workflows building the
          # same tree on two SDKs would make a red run ambiguous.
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build macOS
        # The point of this whole file. macos/ was produced by `flutter create`
        # in #274 and had never been built by anything — not here (Linux
        # container, no Xcode) and not on a developer machine.
        #
        # No signing identity exists on the runner and none is wanted: the
        # project's Release config carries CODE_SIGN_IDENTITY = "-", so
        # xcodebuild ad-hoc signs the bundle. Signing, notarisation and any
        # Apple account are Phase 4/5 work and stay parked (cicd_plan §7.1).
        #
        # macos/Podfile is not committed and does not need to be: the flutter
        # tool writes it from its own template during this step, whenever a
        # project with plugins has none. CocoaPods has never run against this
        # project before, on any platform, so this step is also the first
        # evidence that the plugin set resolves for macOS at all.
        run: flutter build macos --release

      - name: Record the generated Podfile
        # Not committed (above), so print it — otherwise the only artefact of
        # the first CocoaPods run this project has ever had disappears with the
        # runner.
        if: ${{ !cancelled() }}
        run: cat macos/Podfile || echo 'no Podfile was generated'

      - name: Install Tesseract
        # Not a build dependency — nothing links against it. It is here so the
        # steps below can answer a question the build cannot: whether the macOS
        # dylib names in TesseractLibraryCandidates were guessed correctly.
        if: ${{ !cancelled() }}
        run: brew install tesseract leptonica

      - name: Where Homebrew put the libraries
        if: ${{ !cancelled() }}
        run: ls -l "$(brew --prefix)"/lib/libtesseract* "$(brew --prefix)"/lib/liblept*

      - name: Probe the dylib candidates
        # The assertion. Exits non-zero unless at least one candidate opens for
        # libtesseract AND at least one for leptonica, and prints every hit and
        # miss so a list where only the last entry works is distinguishable
        # from one where all four do.
        #
        # This is also what keeps the OCR test below from passing by skipping:
        # `isAvailable` is the same DynamicLibrary.open probe, so if it were
        # false this step would already have failed the job.
        if: ${{ !cancelled() }}
        run: dart run tool/tesseract_dylib_probe.dart

      - name: Probe the dylib candidates inside the App Sandbox
        # INFORMATIONAL — never fails the job, and read the caveats.
        #
        # The shipped app is sandboxed: macos/Runner/Release.entitlements sets
        # com.apple.security.app-sandbox. The sandbox denies file reads outside
        # the app container bar a fixed set of system paths, and /opt/homebrew
        # is not one of them — so a sandboxed build may be unable to open the
        # very dylib the step above just proved is present. That would mean the
        # macOS app reports "install Tesseract" on a machine where Tesseract is
        # installed.
        #
        # Signing this probe with the app's own entitlements file is the
        # closest thing to an answer that does not require launching a GUI app
        # on the runner. Two caveats, both real:
        #   * a bare executable is not an app bundle, so sandbox startup may
        #     fail outright for want of a container — that outcome is
        #     inconclusive, not evidence;
        #   * the systemTemp line means less here than in a real app. launchd
        #     redirects TMPDIR into the container for a bundled app; a binary
        #     run from this shell inherits the shell's TMPDIR, which the
        #     sandbox then denies. A failure there is expected and does not
        #     imply TessdataBundle is broken.
        if: ${{ !cancelled() }}
        run: |
          dart compile exe tool/tesseract_dylib_probe.dart -o "$RUNNER_TEMP/probe"
          codesign --force --sign - \
            --entitlements macos/Runner/Release.entitlements \
            "$RUNNER_TEMP/probe"
          codesign -d --entitlements - "$RUNNER_TEMP/probe" || true
          set +e
          "$RUNNER_TEMP/probe"
          echo "sandboxed probe exited $?"
          set -e

      - name: Hebrew OCR through libtesseract, on macOS
        # The FFI adapter reading a real rendered Hebrew label, on a real Mac.
        # Verified on Linux in #274; this is the first time the same code has
        # run on Darwin, where the dylib names, the symbol ABI and the isolate
        # all differ from the platform it was written on.
        #
        # Only this file: ci.yml already runs the full suite on ubuntu, and
        # repeating 1110 tests at 10x billing buys nothing.
        if: ${{ !cancelled() }}
        run: flutter test --no-pub test/features/keto_lens/data/adapters/tesseract_ffi_recognizer_test.dart
