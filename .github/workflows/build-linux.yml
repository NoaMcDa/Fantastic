name: Build Linux

# Linux is the best-verified platform in this repository and the only desktop
# target that has ever been built and run here — and until this workflow,
# nothing in CI compiled it. `ci.yml` runs format, analyze, test and
# `build web`; a Linux-only break would have reached `main` unnoticed.
#
# Deliberately a separate file from `ci.yml`. `ci.yml` is the required check
# and is kept fast and cheap; this job installs a GTK toolchain, an OCR engine
# and an X server, and is slower for it. Splitting them also means a red Linux
# job names itself in the checks list instead of hiding inside "CI".
#
# This is a platform compile job, not a phase of `design/cicd_plan.md` §7 —
# Phase 1 (codegen drift), Phase 2 (coverage) and the parked Phases 3–5
# (simulator, TestFlight, release) are all untouched by it.

on:
  pull_request:
    branches: [main]
    # Documentation is not an input to this build. A change confined to
    # `design/`, a README or any other Markdown cannot alter what gets
    # compiled, so it does not get a compile. Same list as tool/docs_only.sh,
    # which is what ci.yml skips its own jobs on; `.txt` is deliberately absent
    # from both, because CMakeLists.txt is a build file.
    #
    # A `paths-ignore` here rather than ci.yml's `changes` job because this
    # workflow is not a required check (design/cicd_plan.md §5.5) — a filtered
    # workflow reports no conclusion at all, which only matters for a check a
    # PR is told to wait for. If this ever becomes required, move it to the
    # ci.yml pattern.
    paths-ignore:
      - 'design/**'
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  push:
    branches: [main]
    # Same reasoning as the PR filter above: docs change nothing this builds.
    paths-ignore:
      - 'design/**'
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# Same policy as ci.yml: a superseded PR run is worthless, a run on main is a
# record.
concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build · headless smoke test · tesseract FFI
    runs-on: ubuntu-latest
    # The release build is the long pole; the smoke test adds well under a
    # minute and the FFI suite about half of one.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - name: Install the Linux toolchain, an X server and libtesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            xvfb libgl1-mesa-dri \
            libtesseract-dev libleptonica-dev
        # clang/cmake/ninja/pkg-config/libgtk-3-dev are what `flutter build
        # linux` itself requires. xvfb and libgl1-mesa-dri are for the smoke
        # test below — there is no display and no GPU on a runner, so the app
        # needs an X server to open a window on and a software GL driver to
        # render into. libtesseract/libleptonica are what the Keto Lens FFI
        # adapter dlopens; without them its test suite skips itself.

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to exactly what ci.yml pins. Two workflows disagreeing about
          # the toolchain is a way to get a green gate and a broken build.
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Headless startup smoke test
        # The point of this workflow. A compile proves the Linux target links;
        # it proves nothing about whether the app starts, and every Linux fault
        # this app has had was a startup fault that compiled perfectly (see the
        # script's header and design/m6_platform_handoff.md §4).
        #
        # The script launches the built bundle under Xvfb and asserts it is
        # still alive, that it created its database, and that its log carries
        # none of the fatal patterns. It is deliberately tolerant of headless
        # noise — see its header for exactly what it forgives and why.
        run: tool/linux_smoke_test.sh
        env:
          # llvmpipe, explicitly. There is no GPU and no DRI3 device on a
          # runner; without this the EGL stack spends its time failing over to
          # software rendering anyway, and occasionally fails to.
          LIBGL_ALWAYS_SOFTWARE: '1'

      - name: Keto Lens FFI suite, against a real OCR engine
        # This suite skips itself wherever libtesseract is absent, which until
        # now was everywhere CI has ever run — so the only test in the repo
        # that executes an OCR engine had never executed in CI. libtesseract is
        # installed above, so here it runs for real.
        #
        # A skip is treated as a failure on purpose: silently skipping is the
        # exact failure mode this step exists to end.
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded \
            test/features/keto_lens/data/adapters/tesseract_ffi_recognizer_test.dart \
            2>&1 | tee "$RUNNER_TEMP/ffi-test.log"
          if grep -q 'libtesseract is not installed' "$RUNNER_TEMP/ffi-test.log"; then
            echo "::error::the FFI OCR suite skipped itself — libtesseract did not load on this runner, so nothing was verified"
            exit 1
          fi

      - name: Upload the smoke-test log
        # Always, because the run that matters is the one that failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke-test-log
          path: build/linux_smoke_test.log
          if-no-files-found: warn
