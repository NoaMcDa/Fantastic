name: Build Windows

# Windows is a shipping target that has never been built. `ci.yml` proves the
# Dart compiles and the web bundle links; neither says anything about the
# Windows toolchain, the CMake plugin graph, or
# `flutter_local_notifications_windows` — an `ffiPlugin` with a native C++
# component that no machine in this project has ever compiled.
#
# A separate workflow rather than a job added to `ci.yml`, for two reasons: a
# `windows-latest` runner bills at 2× and should not be spent on a docs-only
# PR, and `ci.yml` is the validation gate every PR waits on — a long Windows
# build does not belong in front of it.

on:
  pull_request:
    branches: [main]
    # Paths-filtered on purpose. Everything that can change what the Windows
    # binary contains is listed; nothing else pays 2× minutes.
    paths:
      - 'windows/**'
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-windows.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build windows · probe libtesseract
    runs-on: windows-latest
    # A cold Windows build compiles every native plugin from source with no
    # pub or CMake cache at all. 45 is generous rather than optimistic.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to exactly what `ci.yml` pins. Two toolchains verifying one
          # repository is one too many: a Windows-only failure must mean
          # Windows, not a version skew.
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Installed before the build so that even a failed build still leaves the
      # DLL inventory below in the log. The Windows library names in
      # TesseractFfiRecognizer were written from documentation and have never
      # been checked against a real Windows install.
      - name: Install Tesseract
        run: choco install --no-progress --yes tesseract

      - name: Inventory the installed Tesseract DLLs
        shell: pwsh
        run: |
          $dir = 'C:\Program Files\Tesseract-OCR'
          if (-not (Test-Path $dir)) {
            Write-Host "::error::chocolatey did not install Tesseract to $dir"
            Get-ChildItem 'C:\Program Files' | Select-Object -ExpandProperty Name
            exit 1
          }
          Write-Host '--- DLLs shipped by the chocolatey tesseract package ---'
          Get-ChildItem $dir -Filter *.dll | Select-Object -ExpandProperty Name
          # LoadLibrary searches PATH for a bare DLL name, which is how
          # TesseractFfiRecognizer opens one. The installer edits the machine
          # PATH, but this job's later shells are not guaranteed to pick that
          # up, so publish it explicitly rather than hoping.
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Build Windows
        # The point of the whole workflow. `--release` rather than `--debug`
        # because release is what links every plugin the way a shipped binary
        # would.
        run: flutter build windows --release --no-pub

      # The names in TesseractFfiRecognizer were written from documentation and
      # had never been exercised. This step exercises them, and it separates the
      # two very different failures that "isAvailable was false" collapses into
      # one:
      #
      #   error 126, module not found    -> THE NAME IS WRONG. That is our bug,
      #                                     and it fails this job.
      #   error 127, procedure not found -> the file was found and loaded, and
      #                                     one of *its own* imports resolved to
      #                                     some other DLL earlier in this
      #                                     runner's very crowded PATH. That is
      #                                     the runner's environment and not our
      #                                     name, so it is reported loudly and
      #                                     the job still stands.
      #
      # Candidate names are read out of the adapter rather than retyped here, so
      # this check cannot drift from the code it checks. The probe is written to
      # RUNNER_TEMP and imports only `dart:` libraries, so it needs no package
      # and `flutter analyze` never sees it.
      #
      # `tesseract_ffi_recognizer_test.dart` is deliberately NOT the gate. It
      # skips when nothing opens — right on a contributor's laptop, useless here,
      # and it cannot tell 126 from 127 either.
      - name: The Windows library names match what a real Tesseract install ships
        shell: bash
        run: |
          adapter=lib/features/keto_lens/data/adapters/tesseract_ffi_recognizer.dart
          mapfile -t names < <(grep -o "'[A-Za-z0-9_.+-]*\.dll'" "$adapter" | tr -d "'" | sort -u)
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error file=$adapter::no .dll candidate names found - this check has stopped reading the adapter."
            exit 1
          fi
          printf 'candidates read from the adapter: %s\n' "${names[*]}"

          cat > "$RUNNER_TEMP/probe_dll.dart" <<'DART'
          import 'dart:ffi';
          import 'dart:io';

          /// Opens every candidate name and reports what Windows said about it.
          ///
          /// Exits non-zero only when a whole family - tesseract or leptonica -
          /// has no candidate naming a file that exists. That, and only that,
          /// means the shipped list is wrong.
          void main(List<String> names) {
            stdout.writeln('--- PATH entries mentioning tesseract ---');
            for (final entry in (Platform.environment['PATH'] ?? '').split(';')) {
              if (entry.toLowerCase().contains('tesseract')) {
                stdout.writeln('  $entry');
              }
            }

            final present = <String>{};
            stdout.writeln('--- DynamicLibrary.open, one line per candidate ---');
            for (final name in names) {
              final family =
                  name.toLowerCase().contains('tesseract') ? 'tesseract' : 'leptonica';
              try {
                DynamicLibrary.open(name);
                present.add(family);
                stdout.writeln('OPEN         $name');
              } on Object catch (error) {
                final text = '$error';
                if (text.contains('error code: 127')) {
                  // The file exists and loaded; one of its own imports did not
                  // resolve. The name is right; this machine's PATH is not.
                  present.add(family);
                  stdout.writeln('DEPS UNMET   $name -> $text');
                } else if (text.contains('error code: 126')) {
                  stdout.writeln('NOT FOUND    $name');
                } else {
                  stdout.writeln('FAILED       $name -> $text');
                }
              }
            }

            var ok = true;
            for (final family in ['tesseract', 'leptonica']) {
              if (!present.contains(family)) {
                ok = false;
                stdout.writeln(
                  '::error::no $family candidate names a file that exists on a '
                  'machine with Tesseract installed - the shipped list is wrong.',
                );
              }
            }
            exit(ok ? 0 : 1);
          }
          DART
          dart run "$RUNNER_TEMP/probe_dll.dart" "${names[@]}"
