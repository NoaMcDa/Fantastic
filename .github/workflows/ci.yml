name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR makes the in-flight run obsolete. Cancel it, but
# never cancel a run on main — those are the ones worth having a record of.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Is there anything here that CI can actually have an opinion about?
  #
  # Editing a design document cannot change what `flutter test` returns, what
  # the coverage gate measures, or whether the web bundle links — nothing under
  # `design/` is compiled, imported or read by any step below. Running the full
  # gate on a docs PR spends four minutes and a reviewer's attention to prove
  # something that was never in question.
  #
  # This is a job with an `if` on its dependents rather than a `paths-ignore`
  # on the workflow, and the difference is load-bearing: a workflow skipped by
  # a path filter never reports a conclusion at all, so a required check that
  # is filtered out leaves the PR waiting on a status that will never arrive
  # (§5.5 of design/cicd_plan.md makes `verify`, `build web` and `e2e flows`
  # required). A *skipped job* does report, and GitHub counts it as a pass.
  # The platform build workflows can and do use `paths` filters because none
  # of them is a required check.
  #
  # The classification itself lives in tool/docs_only.sh — one definition, run
  # locally the same way, and it decides every uncertain case as "code".
  changes:
    name: docs-only?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}

    steps:
      - uses: actions/checkout@v5
        with:
          # The classifier diffs two commits; the default shallow clone has
          # neither of them, and a failed diff means "run everything".
          fetch-depth: 0

      - name: Classify the diff
        id: classify
        env:
          # Read through env rather than interpolated into the script body —
          # these are GitHub's values, not this workflow's, and a `run:` block
          # that pastes them inline is a shell-injection shape regardless of
          # how well-formed today's values happen to be.
          EVENT_NAME: ${{ github.event_name }}
          # On `pull_request` the pair is the PR's base and head; on `push` it
          # is the range the push advanced. `github.event.before` is all zeros
          # for a branch's first push, which the script treats as undecidable
          # and therefore as code.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" != 'pull_request' ] && [ "$EVENT_NAME" != 'push' ]; then
            # workflow_dispatch is somebody asking for this run by hand. Give
            # them the whole thing.
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            echo "::notice::$EVENT_NAME — running the full gate."
            exit 0
          fi

          docs_only=$(tool/docs_only.sh "$BASE_SHA" "$HEAD_SHA")
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

          if [ "$docs_only" = 'true' ]; then
            echo "::notice::Documentation-only change — skipping tests, coverage, web build and e2e flows."
            git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" | sed 's/^/  /'
          else
            echo "::notice::Code changed — running the full gate."
          fi

      - name: No unresolved conflict markers
        # Deliberately in THIS job rather than in `verify`, because this is
        # the only job that runs on a documentation-only diff.
        #
        # #418 committed three unresolved conflict blocks into CLAUDE.md and
        # CI passed. It was right to pass by its own rules — the diff touched
        # only `*.md`, so `tool/docs_only.sh` classified it as docs and the
        # three real jobs skipped, which reports as success. The skip is
        # correct and stays; the gap was that nothing looked at the Markdown
        # the skip was protecting. Half of CLAUDE.md then sat inside a
        # conflict block on `main` — a file every agent session reads first —
        # until #421 was filed.
        #
        # The equivalent in a .dart file would have failed `analyze` in
        # seconds. This is that check, for the file types that have no
        # compiler.
        #
        # The trailing `( |$)` keeps a Markdown rule of seven or more `=`
        # characters under a heading from reading as a conflict marker.
        run: |
          if grep -rnE '^(<{7}|={7}|>{7})( |$)' \
               --include='*.md' --include='*.dart' \
               --include='*.yaml' --include='*.yml' .; then
            echo "::error::unresolved merge-conflict markers are committed — see the paths above"
            exit 1
          fi
          echo "No conflict markers."

  verify:
    name: analyze · format · test · coverage
    needs: changes
    # A skipped job reports success, which is what keeps this usable as a
    # required check on a docs-only PR.
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # The suite is the long pole at ~2 min; the rest of the gate is seconds.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          # Pinned exactly, not a range: this is the version the gate was
          # verified against, and it ships Dart 3.13.3 — the pubspec requires
          # `sdk: ^3.13.2`, which anything older cannot satisfy.
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Lockfile is unchanged
        # pubspec.lock is committed deliberately (#159) so every machine and
        # this runner resolve identical versions. If `pub get` rewrote it, the
        # committed lockfile is stale and the run below is not reproducible.
        run: |
          if ! git diff --exit-code -- pubspec.lock; then
            echo "::error file=pubspec.lock::pubspec.lock is stale — run 'flutter pub get' locally and commit the result."
            exit 1
          fi

      # Cheapest first: a formatting slip should fail in seconds, not after the
      # full suite. Each step below re-uses the resolution above via --no-pub.
      - name: Format
        # integration_test/ is in the list: the e2e suite is source like any
        # other, and a directory nobody checks drifts.
        run: dart format --output=none --set-exit-if-changed lib/ test/ integration_test/

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        # Unit + widget tests only: `flutter test` globs test/ and never
        # reaches integration_test/, which the `e2e flows` job below runs.
        #
        # --coverage writes coverage/lcov.info for the two gates below. It costs
        # roughly a third again on top of a plain run, which buys the only
        # enforcement the 80% contract in design/tests.md has ever had.
        run: flutter test --no-pub --coverage

      - name: Coverage gate — domain + application ≥ 80%
        # design/cicd_plan.md §5.3. A script rather than `very_good_coverage`
        # because the contract is scoped to two layers and no lcov action
        # filters by path — `data/` and `presentation/` are covered by contract
        # and widget tests instead, so including them measures the wrong thing
        # in both directions.
        run: tool/check_coverage.sh coverage/lcov.info 80

      - name: Every gated file has a coverage record
        # The companion the percentage cannot provide: lcov emits no record at
        # all for a file no test imports, so an untested layer reads as 100%
        # rather than as 0%. tool/coverage_ignore.txt names the files that are
        # legitimately absent because they hold nothing executable.
        run: tool/check_coverage_files.sh coverage/lcov.info

      - name: Upload coverage artifact
        # `always()`, so a failed gate still leaves the report to read. Without
        # it the one run that needs inspecting is the one with no artifact.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage/lcov.info
          retention-days: 14

  build-web:
    name: build web
    needs: changes
    # Same gate as `verify`: a Markdown edit cannot change what compiles.
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # A cold release web build is the whole job. 20 caps a hang without
    # cutting an honest cold build short.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          # The same pin as `verify`, for the same reason.
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web
        # Web is a shipping target and has no simulator gate, so a compile is
        # the only thing standing between a merge and a browser-broken main.
        # It also catches what `flutter analyze` structurally cannot: a stray
        # `dart:io` or `path_provider` import leaking past the conditional
        # export in lib/core/database/database_factory.dart.
        #
        # --no-web-resources-cdn bundles CanvasKit into the build instead of
        # fetching it from gstatic.com at run time, so the app boots offline.
        #
        # **A job of its own rather than the last step of `verify`.** It was
        # the tail of that job, so it started only once the ~2-minute suite
        # had finished and added its own ~40 s to the critical path. Nothing
        # it needs is produced by the suite, so the two are independent and
        # the wait bought nothing. Here it runs beside `verify` and `e2e` and
        # the gate finishes when the slowest of the three does. It also names
        # itself in the checks list: a web-only break used to report as a
        # failure of a check whose name began with "analyze · format · test".
        run: flutter build web --release --no-pub --no-web-resources-cdn

  e2e:
    name: e2e flows
    needs: changes
    # Same gate as `verify`. The flows drive the real app; a Markdown edit
    # cannot change what they see.
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # The suite itself runs in ~35s; the budget is for SDK setup and the
    # first compile of the app under test.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          # The same pin as `verify` above, for the same reason.
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: End-to-end flows
        # Two things here are load-bearing, both established in
        # design/m8_preflight.md Part 0:
        #
        #   -d flutter-tester — without a device the run fails outright with
        #   "No supported devices connected". With the headless tester it
        #   drives the real app (real router, real provider graph, real
        #   repositories, real in-memory sembast) on this ubuntu runner. No
        #   simulator is involved, which is what makes this per-PR rather
        #   than a nightly on a 10x-billed macOS box.
        #
        #   integration_test/app_test.dart — the aggregator, not the
        #   directory. Only one app launch is allowed per invocation: point
        #   the runner at the directory and the second file fails with "The
        #   log reader failed unexpectedly".
        #
        # A separate job rather than another step in `verify`: an e2e
        # failure and a unit failure look nothing alike, and this way the
        # two run in parallel instead of queueing behind the web build.
        run: flutter test -d flutter-tester integration_test/app_test.dart --no-pub
