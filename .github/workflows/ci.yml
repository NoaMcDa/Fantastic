name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR makes the in-flight run obsolete. Cancel it, but
# never cancel a run on main — those are the ones worth having a record of.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: analyze · format · test · build web
    runs-on: ubuntu-latest
    # A cold release web build adds a few minutes on top of the gates above.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned exactly, not a range: this is the version the gate was
          # verified against, and it ships Dart 3.13.3 — the pubspec requires
          # `sdk: ^3.13.2`, which anything older cannot satisfy.
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Lockfile is unchanged
        # pubspec.lock is committed deliberately (#159) so every machine and
        # this runner resolve identical versions. If `pub get` rewrote it, the
        # committed lockfile is stale and the run below is not reproducible.
        run: |
          if ! git diff --exit-code -- pubspec.lock; then
            echo "::error file=pubspec.lock::pubspec.lock is stale — run 'flutter pub get' locally and commit the result."
            exit 1
          fi

      # Cheapest first: a formatting slip should fail in seconds, not after the
      # full suite. Each step below re-uses the resolution above via --no-pub.
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        # Unit + widget tests only. integration_test/ does not exist yet and is
        # scoped to run nightly on a macOS simulator, not per-PR (design/tests.md).
        run: flutter test --no-pub

      - name: Build web
        # Web is a shipping target and has no simulator gate, so a compile is
        # the only thing standing between a merge and a browser-broken main.
        # It also catches what `flutter analyze` structurally cannot: a stray
        # `dart:io` or `path_provider` import leaking past the conditional
        # export in lib/core/database/database_factory.dart. Last, because it
        # is by far the slowest step and this list is ordered cheapest-first.
        #
        # --no-web-resources-cdn bundles CanvasKit into the build instead of
        # fetching it from gstatic.com at run time, so the app boots offline.
        run: flutter build web --release --no-pub --no-web-resources-cdn
