name: one-shot — create the M15 label and milestone

# Deliberately `on: push` to this branch and not `workflow_dispatch`: dispatch
# only fires for workflows that already sit on the default branch, so it cannot
# bootstrap itself. Pushing this file is the trigger. Deleted immediately after
# it runs — `ci.yml` and the five build-*.yml files are the only workflows this
# repo keeps. See design/v1_1_split.md §6.
on:
  push:
    branches: [claude/issue-312-milestone-plans-xooi30]

permissions:
  issues: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      # Idempotent throughout: POST returns 422 on a duplicate, so every create
      # falls back to a lookup rather than failing the run. A partial failure
      # can then simply be re-run.
      - name: Create the epic label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/labels" -X POST \
            -f name='epic:m15-meal-entry' \
            -f color='14B8A6' \
            -f description='M15 Meal Entry milestone' \
            || gh api "repos/$REPO/labels/epic:m15-meal-entry"

      - name: Create the milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/milestones" -X POST \
            -f title='M15 — Meal Entry' \
            -f state='open' \
            -f description='Three ways to add a meal: typed, described, photographed. Every one lands in the same editable form before anything is saved. See design/m15_meal_entry_research.md.' \
            > /dev/null 2>&1 || true
          echo 'Milestones now on the repository:'
          gh api "repos/$REPO/milestones?state=all&per_page=100" \
            --jq '.[] | "\(.number)\t\(.title)"'
