name: fantastic
description: "All-in-one keto companion app"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Hebrew locale delegate for MaterialApp (issue #18) — an SDK package,
  # not on pub.dev, not listed in #14's own dependency table.
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management — code-generated Riverpod providers. Using ^3.0.2
  # rather than the ^2.6.1 named in issue #14: 2.6.x's riverpod_generator
  # cannot resolve alongside isar_community_generator (see below) on any
  # released version — their `analyzer`/`source_gen`/`build` ranges never
  # overlap. `@riverpod`/`Ref`/`ConsumerWidget`/`ProviderScope`, the only
  # riverpod APIs any M0 issue uses, are unchanged between 2.6.1 and 3.0.2.
  flutter_riverpod: ^3.0.2
  riverpod_annotation: ^3.0.2

  # Local persistence. A pure-Dart NoSQL document store, chosen over Isar
  # because `isar_community` cannot open a database on web at all: its web
  # `openIsar` is a stub that throws unconditionally. sembast ships an io
  # factory for iOS, a memory factory for tests, and — via `sembast_web` —
  # an IndexedDB factory for the browser, behind one `Database` API.
  sembast: ^3.8.10

  # The browser factory. Talks IndexedDB through `package:web` rather than the
  # deprecated `dart:html`, so it also compiles under `flutter build web --wasm`.
  sembast_web: ^2.4.6

  # Declarative routing with ShellRoute tab-bar support.
  go_router: ^14.6.0

  # App-documents directory lookup, used to build the native database path.
  # Not used on web — `databaseFactoryWeb` names an IndexedDB store instead of
  # a filesystem path, so `lib/core/database/database_factory_web.dart` never
  # imports this.
  path_provider: ^2.1.5

  # Hebrew date formatting for the dashboard header (#49). Comes in
  # transitively via flutter_localizations, but `depend_on_referenced_packages`
  # flags importing a package that is not declared, so it is direct.
  intl: any

  # @immutable for the domain models (#25-#28). Declared directly rather than
  # taken transitively from flutter: `depend_on_referenced_packages` (active
  # via flutter_lints) flags the undeclared import, and the domain layer may
  # not import package:flutter/foundation.dart to get the annotation instead.
  meta: ^1.15.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  # --- Keto Lens (M6) ---

  # On-device Hebrew OCR. No network call is made during a scan, which is
  # Epic #10's first architectural invariant and CLAUDE.md's OCR rule.
  #
  # google_mlkit_text_recognition was here until the platform audit. It was
  # chosen on the rationale in design/technology.md 1 - "Hebrew is a
  # first-class supported script" - which is false. Its script enum is
  # latin/chinese/devanagiri/japanese/korean, there is no Hebrew model, and
  # MlKitTextRecognizer called the bare TextRecognizer(), which defaults to
  # latin. Apple Vision, Windows.Media.Ocr, PaddleOCR and EasyOCR have no
  # Hebrew model either. Tesseract is the only on-device engine that does,
  # and it is the only one that reaches every target - which is why fixing
  # the engine and porting the feature turned out to be one change.
  # design/m6_platform_research.md.
  #
  # Three bindings, one per platform family, each behind
  # TextRecognitionService so no consumer names any of them:
  #
  #   desktop (linux/macos/windows)  dart:ffi against libtesseract  -> `ffi`
  #   mobile  (android/ios)          flutter_tesseract_ocr
  #   web                            tesseract.js, self-hosted in web/
  #
  # `ffi` is the desktop half. Nothing bundles libtesseract for desktop -
  # TesseractFfiRecognizer opens the system library by soname and reports a
  # missing one as ScanFailed rather than crashing, so a desktop build
  # without Tesseract installed degrades instead of dying.
  ffi: ^2.1.0

  # The mobile half. The only published binding that ships prebuilt
  # libtesseract for android and ios, which is the part this repo cannot
  # build for itself.
  #
  # Its pubspec declares a malformed web entry
  # (`web: default_package: FlutterTesseractOcrPlugin` - a class name where
  # a package name belongs). That is why it is `dependency_overrides`-free
  # but must be proven against CI step 6; see design/m6_platform_research.md
  # for the build that settled it. The web half of our firewall never
  # imports it - web goes through tesseract.js - so only the declaration
  # itself can matter.
  flutter_tesseract_ocr: ^0.4.31

  # Live viewfinder. Has a first-party web implementation (camera_web is a
  # declared default_package), so the tab still renders in a browser even
  # though the OCR behind it cannot run there.
  #
  # `permission_handler`, which issue #85 imports and #79 never listed, is
  # deliberately NOT added: `controller.initialize()` already triggers the
  # iOS prompt and throws CameraException('CameraAccessDenied') when
  # refused, so catching that costs one clause and avoids a second
  # native-only plugin on the one screen that has to degrade cleanly on
  # web. design/m6_preflight.md 2.2.
  camera: ^0.11.0

  # Gallery import, the fallback for a photo already taken. Has a web
  # implementation (image_picker_for_web).
  #
  # The `image` package issue #79 also lists is deliberately NOT added:
  # nothing in M6 crops, greyscales or otherwise pre-processes - #85 and
  # #87 both hand a file path straight to InputImage.fromFilePath - so it
  # would be ~2.6 MB of unused Dart that `depend_on_referenced_packages`
  # cannot even flag, because nothing imports it. design/m6_preflight.md
  # 2.1.
  image_picker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Code generation.
  # sembast needs no generator — records are plain maps, written by the
  # codecs in each feature's `data/mappers/`. build_runner stays for riverpod.
  riverpod_generator: ^3.0.2
  build_runner: ^2.4.13

  # Testing. `riverpod_test` (named in issue #14 as `^2.4.0`, which doesn't
  # exist — the real package tops out at 0.1.9 and pins `riverpod: ^2.6.1`,
  # incompatible with riverpod 3.0.2 above) is dropped in favour of
  # `ProviderContainer.test()`, riverpod 3.0's own built-in replacement for
  # it (see the riverpod 3.0.0 changelog).
  mocktail: ^1.0.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Bundled so the app does not depend on a font download at run time.
  # The OFL requires the licence to travel with the font.
  assets:
    - assets/fonts/OFL.txt
    # The Hebrew OCR model, shared by every native target: the desktop
    # FFI half unpacks it through TessdataBundle, and flutter_tesseract_ocr
    # reads this directory plus tessdata_config.json directly. The browser
    # does not use it - it fetches web/tesseract/heb.traineddata instead,
    # because tesseract.js loads over HTTP, not from the asset bundle.
    #
    # tessdata_fast: 961 KB integer model. tessdata_best is 3.5 MB for
    # accuracy nobody has measured yet. design/m6_platform_research.md.
    - assets/tessdata/heb.traineddata
    - assets/tessdata_config.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Hebrew is the primary locale, and CanvasKit — the web renderer — ships no
  # Hebrew glyphs of its own. Unbundled, Flutter web fetches a Hebrew face from
  # fonts.gstatic.com on first paint, so an offline launch, or any network that
  # blocks Google Fonts, renders every string in the app as tofu boxes. iOS is
  # unaffected either way (its system fonts do cover Hebrew), but bundling is
  # what makes an offline-first app actually work offline, and it gives both
  # platforms the same typography.
  #
  # Assistant is the face `design/design_system.md` §Typography already chose
  # for Hebrew/Latin UI text — see its note on SF Pro being unavailable outside
  # an Apple toolchain. Archivo Narrow for tabular numerals, the other half of
  # that decision, is not implemented here; it is a type-scale change rather
  # than a rendering fix.
  #
  # Only 400 and 700 are shipped: they are the only weights the app asks for,
  # and Flutter snaps any other request to the nearest declared weight.
  # Hebrew+Latin subset, ~35 KB per weight. SIL OFL 1.1 — assets/fonts/OFL.txt.
  fonts:
    - family: Assistant
      fonts:
        - asset: assets/fonts/Assistant-Regular.ttf
          weight: 400
        - asset: assets/fonts/Assistant-Bold.ttf
          weight: 700

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
