<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="אפליקציית קטו הכל-באחד — מעקב מאקרו, סריקת תוויות ויומן תסמינים">

  <!--
    Matches AppTheme.primary in lib/core/theme/app_theme.dart, so the browser
    chrome agrees with the app instead of framing a dark UI in white.
  -->
  <meta name="theme-color" content="#1C1C1E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fantastic">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Fantastic</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      The page is painted before the Flutter canvas exists. Without this the
      browser shows its default white for however long main.dart.js takes to
      load and boot — a hard flash into a dark-mode-first app. #1C1C1E is
      AppTheme.primary.
    */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #1C1C1E;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Keto Lens OCR, self-hosted. Both files are served from this deploy: the
       scan makes no network request, which Epic #10's first architectural
       invariant requires. Loaded before the Flutter bootstrap so
       window.fantasticOcr exists by the time the lens tab is reachable. -->
  <script src="tesseract/tesseract.min.js"></script>
  <script src="tesseract/fantastic_ocr.js"></script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
