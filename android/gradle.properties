org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The template also wrote `android.newDsl=false` and `android.builtInKotlin=false`
# here. Both are AGP 9 switches — the new DSL and AGP's built-in Kotlin support
# only exist from AGP 9.0 — and this project builds on AGP 8.13.1 (see
# settings.gradle.kts for why). AGP 8 ignores them, so they were not breaking
# anything; they are removed because a flag that reads as a deliberate choice
# and in fact does nothing is worse than no flag. Restore both when the AGP 9
# upgrade happens.
#
# Built-in Kotlin being off is also what makes the app's `kotlin { }` block
# work here: with AGP < 9, Flutter's Gradle plugin applies `kotlin-android`
# itself (FlutterPluginUtils.detectApplyingKotlinGradlePlugin), which is why
# app/build.gradle.kts declares no Kotlin plugin of its own.
